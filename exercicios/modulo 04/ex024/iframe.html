<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframes</title>
</head>
<body>
    <!--Por padrão o tamanho dos Iframes vem de 300x150
    Mas é possivel mudar isso de forma inline direto no Iframe ou usando CSS. -->
    <h1>Testando o uso de um Iframe</h1>
    <p>

        Acesssando o site do 

        <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://www.cursoemvideo.com" target="_blank">CursoEmVideo</a>
        </iframe>

        para aprender a programar.
    </p>

    <p>

       O repositorio do guanabara <iframe src="https://gustavoguanabara.github.io" frameborder="0">

        <a href="https://gustavoguanabara.github.io" target="_blank">Repoditorio Gustavo Guanabara</a>
       </iframe> 
       
       tambem é bem legal.
     <!--Da pra configurar a barra de rolagem do Iframe usando o parametro "scolling" com (auto, yes e no) porem alguns navegadores podem não aceitar alguns parametros, tambem é possivel configurar as bordas mas é recomendavel usar CSS pois direto no iframe usando o "frameborder" não vai fazer diferença nenhuma-->
        
    </p>
</body>
</html>
