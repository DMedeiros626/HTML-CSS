<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <style>
        body {
            background-image: linear-gradient(to bottom, darkgreen, green);
        }

        fieldset {
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formularios</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <!--No "input-radio" é recomendavel de o "name" igual para não haver erro de voce não conseguir desmarcar as opções-->
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas">
            <label for="isxmas">Masculino</label><br>
            <input type="radio" name="sexo" id="isxfem">
            <label for="isxfem">Feminio</label>
        </fieldset><br>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas">
            <label for="iesbas">Basquete</label><br>
            <input type="checkbox" name="esten" id="iesten">
            <label for="iesten">Tenis</label><br>
            <input type="checkbox" name="esfut" id="iesfut">
            <label for="iesfut">Futbol</label><br>
            <input type="checkbox" name="esnat" id="iesnat">
            <label for="iesnat">Natação</label><br>
        </fieldset>

    </form>
</body>
</html>
