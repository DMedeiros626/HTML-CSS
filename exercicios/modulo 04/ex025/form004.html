<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <!--OBS: Estudar sobre RegEX-->
    <h1>exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <!--O comando "fieldset" criou um agrupamento dos dados juntando todos os outros comandos em um tipo de caixa qua pode ser personalizado com CSS, e o "legend" criou uma legenda para esse caixa-->
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="imail">E-mail</label>
                <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="E-mail">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" required placeholder="(83)99999-9999" pattern="^[0-9]{4}-[0-9]{4}$">
            </p>
            
        </fieldset>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
</body>
</html>
